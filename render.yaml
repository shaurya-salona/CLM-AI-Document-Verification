services:
  # 1. FastAPI Backend API Web Service
  - type: web
    name: clm-backend
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clm_db_svba
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

  # 2. Vite React Frontend Web Service (Static Site)
  - type: web
    name: clm-frontend
    env: static
    buildCommand: "npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: clm-backend
          property: url

databases:
  # 3. Managed Enterprise PostgreSQL Database Instance
  - name: clm_db_svba
    databaseName: clm_db_svba
    user: clm_db_svba_user
    region: singapore
    plan: free
